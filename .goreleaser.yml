version: 2

builds:
  - id: yop-cli
    binary: yop-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.telemetryWebhook={{ .Env.YOP_TELEMETRY_WEBHOOK }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - name_template: "yop-cli-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

after:
  hooks:
    - node scripts/prepare-release.js {{ .Version }}
